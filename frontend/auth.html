<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accesso - Nota Bene</title>
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <div class="overlay"></div>

  <div class="auth-wrapper">

    <!--  Sezione logo / slogan -->
    <div class="auth-side">
      <div class="logo-container">
        <img src="img/logo-notabene.png" alt="Logo Nota Bene" class="logo" />
        <h2>Le tue idee. Ben organizzate.</h2>
      </div>
    </div>

    <!-- Sezione form -->
    <div class="auth-form">
      
      <!-- LOGIN -->
      <div id="loginSection" class="form-inner">
        <h1>BENVENUTO!</h1>
        <p class="subtitle">Accedi per continuare a scrivere, salvare e condividere le tue note.</p>

        <div class="input-group">
          <input type="text" id="username" class="input-field" placeholder=" " required autocomplete="off" />
          <label for="username" class="input-label">Username</label>
        </div>

        <div class="input-group">
          <input type="password" id="password" class="input-field" placeholder=" " required autocomplete="off" />
          <label for="password" class="input-label">Password</label>
        </div>
        <button id="loginBtn" class="primary-btn">Accedi</button>

        <p class="switch-text">
          Non hai un account?
          <a href="#" id="showRegister">Registrati</a>
        </p>
        <p id="msg"></p>
      </div>

      <!-- REGISTRAZIONE -->
      <div id="registerSection" class="form-inner hidden">
        <h1>CREA UN ACCOUNT</h1>
        <p class="subtitle">Registrati per iniziare a organizzare le tue note con facilità.</p>

        <div class="input-group">
          <input type="text" id="newUsername" class="input-field" placeholder=" " required autocomplete="off" />
          <label for="newUsername" class="input-label">Username</label>
        </div>

        <div class="input-group">
          <input type="password" id="newPassword" class="input-field" placeholder=" " required autocomplete="off" />
          <label for="newPassword" class="input-label">Password</label>
        </div>

        <div class="input-group">
          <input type="password" id="confirmPassword" class="input-field" placeholder=" " required autocomplete="off" />
          <label for="confirmPassword" class="input-label">Conferma password</label>
        </div>
        <button id="registerBtn" class="primary-btn">Registrati</button>

        <p class="switch-text">
          Hai già un account?
          <a href="#" id="showLogin">Accedi</a>
        </p>
        <p id="msgRegister"></p>
      </div>

    </div>

  </div>

  <script src="js/auth.js"></script>
</body>
</html>
