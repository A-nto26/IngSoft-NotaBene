<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Accesso - Nota Bene</title>
  <link rel="stylesheet" href="css/auth.css" />
</head>
<body>

  <div class="auth-wrapper">

    <!-- COLONNA SINISTRA (Logo) -->
    <div class="auth-side">
      <div class="logo-container">
        <img src="img/logo-notabene.png" alt="Logo Nota Bene" class="logo" />
        <h2>Le tue idee. Ben organizzate.</h2>
      </div>
    </div>

    <!-- COLONNA DESTRA (Form login/register) -->
    <div class="auth-form">

      <!-- LOGIN -->
      <div id="loginSection">
        <h1>BENVENUTO!</h1>
        <p class="subtitle">Accedi per continuare.</p>

        <input type="text" id="username" placeholder="Username" autocomplete="off" />
        <input type="password" id="password" placeholder="Password" autocomplete="off" />

        <button id="loginBtn" class="primary-btn">Accedi</button>

        <p class="switch-text">
          Non hai un account?
          <a href="#" id="showRegister">Registrati</a>
        </p>

        <p id="msg"></p>
      </div>

      <!-- REGISTER -->
      <div id="registerSection" class="hidden">
        <h1>Crea un account</h1>
        <p class="subtitle">Registrati per iniziare.</p>

        <input type="text" id="newUsername" placeholder="Username" autocomplete="off" />
        <input type="password" id="newPassword" placeholder="Password" autocomplete="off" />
        <input type="password" id="confirmPassword" placeholder="Conferma password" autocomplete="off" />

        <button id="registerBtn" class="primary-btn">Registrati</button>

        <p class="switch-text">
          Hai già un account?
          <a href="#" id="showLogin">Accedi</a>
        </p>

        <p id="msgRegister"></p>
      </div>

    </div>

  </div>

  <script src="js/auth.js"></script>
</body>
</html>
